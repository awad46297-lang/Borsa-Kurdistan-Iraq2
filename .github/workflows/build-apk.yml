name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project files
        shell: bash
        run: |
          mkdir -p "$(dirname "settings.gradle.kts")"
          echo "" | base64 -d > "settings.gradle.kts"
          mkdir -p "$(dirname "build.gradle.kts")"
          echo "" | base64 -d > "build.gradle.kts"
          mkdir -p "$(dirname "gradle.properties")"
          echo "b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg==" | base64 -d > "gradle.properties"
          mkdir -p "$(dirname "app/build.gradle.kts")"
          echo "" | base64 -d > "app/build.gradle.kts"
          mkdir -p "$(dirname "app/src/main/AndroidManifest.xml")"
          echo "" | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname "app/src/main/res/values/strings.xml")"
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPtio2YjYsdi12Kkg2YPYsdiv2LPYqtin2YYg2YjYp9mE2LnYsdin2YI8L3N0cmluZz4KPC9yZXNvdXJjZXM+Cg==" | base64 -d > "app/src/main/res/values/strings.xml"
          mkdir -p "$(dirname "app/src/main/res/values/styles.xml")"
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHJlc291cmNlcz4KICAgIDxzdHlsZSBuYW1lPSJUaGVtZS5Cb3JzYUt1cmRpc3RhbklyYXEiIHBhcmVudD0iYW5kcm9pZDpzdHlsZS9UaGVtZS5NYXRlcmlhbC5MaWdodC5Ob0FjdGlvbkJhciIgLz4KPC9yZXNvdXJjZXM+Cg==" | base64 -d > "app/src/main/res/values/styles.xml"
          mkdir -p "$(dirname "app/src/main/java/com/iraqrates/app/MainActivity.kt")"
          echo "" | base64 -d > "app/src/main/java/com/iraqrates/app/MainActivity.kt"

      - name: Put Firebase config in app
        run: |
          mkdir -p app
          cp google-services.json app/google-services.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Borsa-Kurdistan-Iraq-APK
          path: app/build/outputs/apk/debug/app-debug.apk
